<svg xmlns="http://www.w3.org/2000/svg" width="880" height="742" viewBox="0 0 880 742" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>S2-C — search and sort the requests list</title>
  <desc>Three states: the search box at rest with a magnifying glass and placeholder, the search and sort active with the URL carrying both alongside the existing filters, and the empty state when a search matches nothing.</desc>

  <rect width="880" height="742" fill="#ffffff"/>

  <text x="24" y="20" font-size="11" fill="#adb5bd">At rest — the magnifying glass and placeholder are what make it read as a search box</text>

  <text x="24" y="46" font-size="12" fill="#6c757d">Search</text>
  <rect x="24" y="54" width="230" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <circle cx="41" cy="69" r="5.5" fill="none" stroke="#6c757d" stroke-width="1.6"/>
  <path d="M45 73 l4.5 4.5" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round"/>
  <text x="60" y="76" font-size="12.5" fill="#adb5bd">Search requests</text>

  <text x="270" y="46" font-size="12" fill="#6c757d">Status</text>
  <rect x="270" y="54" width="140" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="282" y="76" font-size="13" fill="#212529">All</text>
  <path d="M388 68 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="426" y="46" font-size="12" fill="#6c757d">Requested by</text>
  <rect x="426" y="54" width="190" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="438" y="76" font-size="13" fill="#212529">Anyone</text>
  <path d="M594 68 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <rect x="632" y="54" width="104" height="34" rx="5" fill="#ffffff" stroke="#adb5bd"/>
  <text x="684" y="76" font-size="12.5" fill="#212529" text-anchor="middle">Clear filters</text>

  <path d="M756 71 l-12 0" stroke="#adb5bd" stroke-width="1"/>
  <text x="762" y="68" font-size="11" fill="#6c757d">S2-E adds</text>
  <text x="762" y="81" font-size="11" fill="#6c757d">this one</text>

  <line x1="24" y1="112" x2="856" y2="112" stroke="#dee2e6"/>
  <text x="24" y="134" font-size="11" fill="#adb5bd">Searching and sorting — the active column shows its direction; the others stay quiet until hovered</text>

  <text x="24" y="160" font-size="12" fill="#6c757d">Search</text>
  <rect x="24" y="168" width="230" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <circle cx="41" cy="183" r="5.5" fill="none" stroke="#6c757d" stroke-width="1.6"/>
  <path d="M45 187 l4.5 4.5" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round"/>
  <text x="60" y="190" font-size="13" fill="#212529">docking</text>

  <text x="270" y="160" font-size="12" fill="#6c757d">Status</text>
  <rect x="270" y="168" width="140" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="282" y="190" font-size="13" fill="#212529">All</text>
  <path d="M388 182 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="426" y="160" font-size="12" fill="#6c757d">Requested by</text>
  <rect x="426" y="168" width="190" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="438" y="190" font-size="13" fill="#212529">Anyone</text>
  <path d="M594 182 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="24" y="230" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#adb5bd">/requests?search=docking&amp;sort=total&amp;dir=desc</text>

  <rect x="24" y="244" width="832" height="262" rx="10" fill="#f8f9fa"/>
  <text x="44" y="270" font-size="11.5" fill="#6c757d">Description</text>
  <text x="392" y="270" font-size="11.5" fill="#007AFF">Status</text>
  <text x="440" y="270" font-size="11" fill="#adb5bd">↕</text>
  <text x="498" y="270" font-size="11.5" fill="#007AFF">Total</text>
  <text x="534" y="270" font-size="11" fill="#007AFF">↓</text>
  <text x="586" y="270" font-size="11.5" fill="#6c757d">Requested by</text>

  <path d="M534 282 l0 10" stroke="#adb5bd" stroke-width="1"/>
  <text x="548" y="298" font-size="11" fill="#6c757d">sorted, descending</text>

  <line x1="40" y1="312" x2="840" y2="312" stroke="#dee2e6"/>
  <text x="44" y="330" font-size="13" fill="#212529">Laptop docking stations</text>
  <text x="44" y="344" font-size="11" fill="#6c757d">New hires start next month</text>
  <rect x="392" y="320" width="60" height="19" rx="4" fill="#ffc107"/>
  <text x="422" y="333.5" font-size="10.5" fill="#412402" text-anchor="middle">REVIEW</text>
  <text x="498" y="333" font-size="13" fill="#212529">$1,240.00</text>
  <text x="586" y="330" font-size="13" fill="#212529">Marcus Feil</text>
  <text x="586" y="344" font-size="11" fill="#6c757d">Delivery</text>
  <text x="836" y="339" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <line x1="40" y1="366" x2="840" y2="366" stroke="#dee2e6"/>
  <text x="44" y="384" font-size="13" fill="#212529">Docking station power bricks</text>
  <text x="44" y="398" font-size="11" fill="#6c757d">Spares for the ones that fail</text>
  <rect x="392" y="374" width="46" height="19" rx="4" fill="#0d6efd"/>
  <text x="415" y="387.5" font-size="10.5" fill="#ffffff" text-anchor="middle">NEW</text>
  <text x="498" y="387" font-size="13" fill="#212529">$318.00</text>
  <text x="586" y="384" font-size="13" fill="#212529">Dana Ward</text>
  <text x="586" y="398" font-size="11" fill="#6c757d">Pickup</text>
  <text x="836" y="393" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <line x1="40" y1="420" x2="840" y2="420" stroke="#dee2e6"/>
  <text x="44" y="438" font-size="13" fill="#212529">Replace docking cables</text>
  <text x="44" y="452" font-size="11" fill="#6c757d">Fraying on several desks</text>
  <rect x="392" y="428" width="72" height="19" rx="4" fill="#198754"/>
  <text x="428" y="441.5" font-size="10.5" fill="#ffffff" text-anchor="middle">APPROVED</text>
  <text x="498" y="441" font-size="13" fill="#212529">$46.80</text>
  <text x="586" y="438" font-size="13" fill="#212529">Priya Raman</text>
  <text x="586" y="452" font-size="11" fill="#6c757d">Pickup</text>
  <text x="836" y="447" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <text x="44" y="486" font-size="11.5" fill="#6c757d">Search matches description and justification. Sort, search and both filters all combine.</text>

  <line x1="24" y1="534" x2="856" y2="534" stroke="#dee2e6"/>
  <text x="24" y="556" font-size="11" fill="#adb5bd">No matches — a message that names the search term, not a headers-only table</text>

  <text x="24" y="582" font-size="12" fill="#6c757d">Search</text>
  <rect x="24" y="590" width="230" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <circle cx="41" cy="605" r="5.5" fill="none" stroke="#6c757d" stroke-width="1.6"/>
  <path d="M45 609 l4.5 4.5" stroke="#6c757d" stroke-width="1.6" stroke-linecap="round"/>
  <text x="60" y="612" font-size="13" fill="#212529">ergonomic mouse</text>

  <rect x="270" y="590" width="104" height="34" rx="5" fill="#ffffff" stroke="#adb5bd"/>
  <text x="322" y="612" font-size="12.5" fill="#212529" text-anchor="middle">Clear filters</text>

  <rect x="24" y="640" width="832" height="86" rx="10" fill="#f8f9fa"/>
  <circle cx="440" cy="670" r="7" fill="none" stroke="#adb5bd" stroke-width="1.6"/>
  <path d="M445 675 l6 6" stroke="#adb5bd" stroke-width="1.6" stroke-linecap="round"/>
  <text x="440" y="700" font-size="12.5" fill="#6c757d" text-anchor="middle">No requests match “ergonomic mouse”. Try a different word, or clear the search.</text>
</svg>
