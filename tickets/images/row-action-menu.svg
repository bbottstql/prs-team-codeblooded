<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The review affordance in the row and in the open menu</title>
  <desc>Two request rows with the three-dots dropdown open. On a request the signed-in reviewer may act on, the row reads Review and the first menu item reads Review. On their own request the row reads View only and the menu item reads View. The requester and delivery mode are unchanged in both.</desc>

  <rect width="880" height="316" fill="#ffffff"/>

  <text x="24" y="20" font-size="11" fill="#adb5bd">Someone else's request, status REVIEW, signed in as a reviewer</text>
  <rect x="24" y="28" width="600" height="62" fill="#f8f9fa"/>
  <text x="44" y="50" font-size="13" fill="#212529">Standing desk converters</text>
  <text x="44" y="64" font-size="11" fill="#6c757d">Ergonomic assessment recommended</text>
  <rect x="300" y="40" width="60" height="19" rx="4" fill="#ffc107"/>
  <text x="330" y="53.5" font-size="10.5" fill="#412402" text-anchor="middle">REVIEW</text>
  <text x="392" y="53" font-size="13" fill="#212529">$412.50</text>
  <text x="470" y="50" font-size="13" fill="#212529">Dana Ward</text>
  <text x="470" y="64" font-size="11" fill="#6c757d">Pickup</text>
  <text x="470" y="78" font-size="11" fill="#007AFF">Review</text>
  <text x="608" y="63" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <rect x="596" y="92" width="130" height="86" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <rect x="597" y="93" width="128" height="27" fill="#e7f1ff"/>
  <text x="612" y="111" font-size="12.5" fill="#0a58ca">Review</text>
  <text x="612" y="138" font-size="12.5" fill="#212529">Edit</text>
  <text x="612" y="165" font-size="12.5" fill="#212529">Delete</text>

  <text x="24" y="212" font-size="11" fill="#adb5bd">The reviewer's own request, also status REVIEW</text>
  <rect x="24" y="220" width="600" height="62" fill="#f8f9fa"/>
  <text x="44" y="242" font-size="13" fill="#212529">Monitor arms</text>
  <text x="44" y="256" font-size="11" fill="#6c757d">Reclaim desk space</text>
  <rect x="300" y="232" width="60" height="19" rx="4" fill="#ffc107"/>
  <text x="330" y="245.5" font-size="10.5" fill="#412402" text-anchor="middle">REVIEW</text>
  <text x="392" y="245" font-size="13" fill="#212529">$47.00</text>
  <text x="470" y="242" font-size="13" fill="#212529">Torrey Schoen <tspan fill="#adb5bd">(you)</tspan></text>
  <text x="470" y="256" font-size="11" fill="#6c757d">Pickup</text>
  <text x="470" y="270" font-size="11" fill="#adb5bd">View only</text>
  <text x="608" y="255" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <rect x="646" y="196" width="130" height="86" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="662" y="215" font-size="12.5" fill="#212529">View</text>
  <text x="662" y="242" font-size="12.5" fill="#212529">Edit</text>
  <text x="662" y="269" font-size="12.5" fill="#212529">Delete</text>

  <path d="M790 108 l-52 0" stroke="#adb5bd" stroke-width="1"/>
  <text x="796" y="99" font-size="11" fill="#6c757d">both the row line</text>
  <text x="796" y="112" font-size="11" fill="#6c757d">and the menu item,</text>
  <text x="796" y="125" font-size="11" fill="#6c757d">one predicate</text>
</svg>
