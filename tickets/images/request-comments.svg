<svg xmlns="http://www.w3.org/2000/svg" width="880" height="748" viewBox="0 0 880 748" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>S2-A — comments on a request</title>
  <desc>The whole request detail page in order: the header row with the new comment count badge beside the workflow buttons, the request summary in definition-list columns, the existing items table, and then the new comments section with author, timestamp, a delete control on your own comment only, and a textarea with an Add comment button.</desc>

  <rect width="880" height="748" fill="#ffffff"/>

  <text x="24" y="20" font-size="11" fill="#adb5bd">The count badge in the header row, beside the workflow buttons — the only change to this row</text>

  <text x="24" y="52" font-size="20" fill="#212529">Request</text>
  <rect x="452" y="36" width="96" height="19" rx="9.5" fill="#e2e3e5"/>
  <text x="500" y="49.5" font-size="11" fill="#41464b" text-anchor="middle">3 comments</text>
  <rect x="572" y="32" width="110" height="30" rx="5" fill="#0d6efd"/>
  <text x="627" y="52" font-size="12.5" fill="#ffffff" text-anchor="middle">Approve</text>
  <rect x="692" y="32" width="94" height="30" rx="5" fill="#ffffff" stroke="#dc3545"/>
  <text x="739" y="52" font-size="12.5" fill="#dc3545" text-anchor="middle">Reject</text>
  <text x="836" y="52" font-size="15" fill="#007AFF" text-anchor="end">✎</text>
  <line x1="24" y1="72" x2="856" y2="72" stroke="#dee2e6" stroke-width="2"/>

  <text x="24" y="96" font-size="11" fill="#adb5bd">Existing summary and items table, unchanged — shown for placement</text>

  <text x="24" y="124" font-size="11" fill="#6c757d">Description</text>
  <text x="24" y="140" font-size="13" fill="#212529">Laptop docking stations</text>
  <text x="24" y="164" font-size="11" fill="#6c757d">Justification</text>
  <text x="24" y="180" font-size="13" fill="#212529">New hires start next month</text>

  <text x="380" y="124" font-size="11" fill="#6c757d">Delivery Method</text>
  <text x="380" y="140" font-size="13" fill="#212529">Delivery</text>
  <text x="380" y="164" font-size="11" fill="#6c757d">Status</text>
  <rect x="380" y="170" width="60" height="19" rx="4" fill="#ffc107"/>
  <text x="410" y="183.5" font-size="10.5" fill="#412402" text-anchor="middle">REVIEW</text>

  <text x="616" y="124" font-size="11" fill="#6c757d">Requested By</text>
  <text x="616" y="140" font-size="13" fill="#212529">Marcus Feil</text>

  <rect x="24" y="206" width="832" height="146" rx="10" fill="#f8f9fa"/>
  <text x="44" y="232" font-size="15" fill="#212529">Items</text>
  <text x="44" y="256" font-size="11.5" fill="#6c757d">Product</text>
  <text x="380" y="256" font-size="11.5" fill="#6c757d">Price</text>
  <text x="500" y="256" font-size="11.5" fill="#6c757d">Quantity</text>
  <text x="620" y="256" font-size="11.5" fill="#6c757d">Amount</text>

  <line x1="44" y1="268" x2="836" y2="268" stroke="#dee2e6"/>
  <text x="44" y="288" font-size="13" fill="#212529">Docking station, dual monitor</text>
  <text x="380" y="288" font-size="13" fill="#212529">$248.00</text>
  <text x="500" y="288" font-size="13" fill="#212529">4</text>
  <text x="620" y="288" font-size="13" fill="#212529">$992.00</text>

  <line x1="44" y1="302" x2="836" y2="302" stroke="#dee2e6"/>
  <text x="44" y="322" font-size="13" fill="#212529">Docking cable, USB-C</text>
  <text x="380" y="322" font-size="13" fill="#212529">$62.00</text>
  <text x="500" y="322" font-size="13" fill="#212529">4</text>
  <text x="620" y="322" font-size="13" fill="#212529">$248.00</text>

  <line x1="44" y1="336" x2="836" y2="336" stroke="#e9ecef"/>
  <text x="620" y="346" font-size="12.5" fill="#212529">$1,240.00</text>

  <text x="24" y="384" font-size="11" fill="#adb5bd">New — the comments section goes below the items table, oldest first. Delete appears on your own comment only</text>

  <rect x="24" y="396" width="832" height="330" rx="10" fill="#f8f9fa"/>
  <text x="44" y="422" font-size="15" fill="#212529">Comments</text>

  <line x1="44" y1="438" x2="836" y2="438" stroke="#dee2e6"/>
  <text x="44" y="460" font-size="13" fill="#212529">Marcus Feil</text>
  <text x="130" y="460" font-size="11" fill="#adb5bd">12 Mar 2026, 09:14</text>
  <text x="44" y="478" font-size="13" fill="#212529">Can we get a second quote on the docking stations before I approve this?</text>

  <line x1="44" y1="496" x2="836" y2="496" stroke="#dee2e6"/>
  <text x="44" y="518" font-size="13" fill="#212529">Dana Ward</text>
  <text x="122" y="518" font-size="11" fill="#adb5bd">12 Mar 2026, 11:02</text>
  <text x="836" y="518" font-size="12" fill="#adb5bd" text-anchor="end">Delete</text>
  <text x="44" y="536" font-size="13" fill="#212529">Added one from Bailey — it came in $40 higher, so I've left the original.</text>

  <line x1="44" y1="554" x2="836" y2="554" stroke="#dee2e6"/>
  <text x="44" y="576" font-size="13" fill="#212529">Marcus Feil</text>
  <text x="130" y="576" font-size="11" fill="#adb5bd">12 Mar 2026, 11:40</text>
  <text x="44" y="594" font-size="13" fill="#212529">Good enough for me. Approving.</text>

  <rect x="44" y="614" width="792" height="60" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="58" y="638" font-size="12.5" fill="#adb5bd">Add a comment…</text>

  <rect x="716" y="686" width="120" height="30" rx="5" fill="#0d6efd"/>
  <text x="776" y="706" font-size="12.5" fill="#ffffff" text-anchor="middle">Add comment</text>
</svg>
