<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The Requested by dropdown, open</title>
  <desc>The Requested by select expanded: Anyone, the signed-in user's own name marked you, Anyone else, then the other users. Anyone else appears only for reviewers.</desc>

  <rect width="560" height="304" fill="#ffffff"/>

  <text x="24" y="34" font-size="12" fill="#6c757d">Status</text>
  <rect x="24" y="42" width="130" height="34" rx="5" fill="#ffffff" stroke="#ced4da"/>
  <text x="36" y="64" font-size="13" fill="#212529">All</text>
  <path d="M132 56 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="170" y="34" font-size="12" fill="#6c757d">Requested by</text>
  <rect x="170" y="42" width="210" height="34" rx="5" fill="#ffffff" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="182" y="64" font-size="13" fill="#212529">Anyone else</text>
  <path d="M358 60 l5 -5 l5 5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <rect x="170" y="80" width="210" height="200" rx="6" fill="#ffffff" stroke="#ced4da"/>

  <text x="182" y="102" font-size="13" fill="#212529">Anyone</text>
  <line x1="170" y1="112" x2="380" y2="112" stroke="#f1f3f5"/>

  <text x="182" y="130" font-size="13" fill="#212529">Torrey Schoen <tspan fill="#adb5bd">(you)</tspan></text>

  <rect x="171" y="140" width="208" height="26" fill="#e7f1ff"/>
  <text x="182" y="158" font-size="13" fill="#0a58ca">Anyone else</text>
  <line x1="170" y1="170" x2="380" y2="170" stroke="#f1f3f5"/>

  <text x="182" y="188" font-size="13" fill="#212529">Dana Ward</text>
  <text x="182" y="214" font-size="13" fill="#212529">Marcus Feil</text>
  <text x="182" y="240" font-size="13" fill="#212529">Priya Raman</text>
  <text x="182" y="266" font-size="13" fill="#212529">Sam Okafor</text>

  <path d="M400 153 l-14 0" stroke="#adb5bd" stroke-width="1"/>
  <text x="406" y="150" font-size="11" fill="#6c757d">reviewers only —</text>
  <text x="406" y="163" font-size="11" fill="#6c757d">needs its own parameter,</text>
  <text x="406" y="176" font-size="11" fill="#6c757d">not a value of userId</text>
</svg>
