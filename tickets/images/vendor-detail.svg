<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>S1-D — the vendor detail page</title>
  <desc>Three views: the Details item added to the vendor card's three-dots dropdown, the vendor detail page with its information in definition-list columns above a table of that vendor's products, and the empty state for a vendor supplying no products.</desc>

  <rect width="880" height="700" fill="#ffffff"/>

  <text x="24" y="20" font-size="11" fill="#adb5bd">How you reach it — “Details” is the new item on the existing dropdown</text>

  <rect x="24" y="30" width="240" height="146" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="25" y="31" width="143" height="5" rx="2" fill="#0d6efd"/>
  <text x="40" y="62" font-size="14" fill="#212529">Bailey, Baumbach</text>
  <text x="40" y="79" font-size="14" fill="#212529">and Senger</text>
  <rect x="40" y="90" width="66" height="18" rx="4" fill="#6c757d"/>
  <text x="73" y="103" font-size="10.5" fill="#ffffff" text-anchor="middle">BAIL-EY</text>
  <text x="40" y="126" font-size="11.5" fill="#6c757d">3293 State Street</text>
  <text x="40" y="141" font-size="11.5" fill="#6c757d">Aurora, CO 80014</text>
  <text x="40" y="156" font-size="11.5" fill="#6c757d">(303) 965-3180</text>
  <text x="248" y="60" font-size="15" fill="#007AFF" text-anchor="end">⋮</text>

  <rect x="248" y="52" width="124" height="86" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <rect x="249" y="53" width="122" height="27" fill="#e7f1ff"/>
  <text x="262" y="71" font-size="12.5" fill="#0a58ca">Details</text>
  <text x="262" y="98" font-size="12.5" fill="#212529">Edit</text>
  <text x="262" y="125" font-size="12.5" fill="#212529">Delete</text>

  <path d="M396 66 l-16 0" stroke="#adb5bd" stroke-width="1"/>
  <text x="402" y="63" font-size="11" fill="#6c757d">new — the other two</text>
  <text x="402" y="76" font-size="11" fill="#6c757d">already exist</text>

  <line x1="24" y1="200" x2="856" y2="200" stroke="#dee2e6"/>
  <text x="24" y="222" font-size="11" fill="#adb5bd">/vendors/detail/1 — information in definition-list columns, then that vendor's products</text>

  <text x="24" y="256" font-size="20" fill="#212529">Vendor</text>
  <text x="836" y="252" font-size="15" fill="#007AFF" text-anchor="end">✎</text>
  <line x1="24" y1="270" x2="856" y2="270" stroke="#dee2e6" stroke-width="2"/>

  <text x="24" y="294" font-size="11" fill="#6c757d">Code</text>
  <text x="24" y="310" font-size="13" fill="#212529">BAIL-EY</text>
  <text x="24" y="336" font-size="11" fill="#6c757d">Name</text>
  <text x="24" y="352" font-size="13" fill="#212529">Bailey, Baumbach and Senger</text>

  <text x="320" y="294" font-size="11" fill="#6c757d">Address</text>
  <text x="320" y="310" font-size="13" fill="#212529">3293 State Street</text>
  <text x="320" y="336" font-size="11" fill="#6c757d">City / State / Zip</text>
  <text x="320" y="352" font-size="13" fill="#212529">Aurora, CO 80014</text>

  <text x="616" y="294" font-size="11" fill="#6c757d">Phone</text>
  <text x="616" y="310" font-size="13" fill="#212529">(303) 965-3180</text>
  <text x="616" y="336" font-size="11" fill="#6c757d">Email</text>
  <text x="616" y="352" font-size="13" fill="#007AFF">orders@baileybaumbach.com</text>

  <rect x="24" y="380" width="832" height="184" rx="10" fill="#f8f9fa"/>
  <text x="44" y="406" font-size="15" fill="#212529">Products</text>
  <text x="44" y="432" font-size="11.5" fill="#6c757d">Part number</text>
  <text x="200" y="432" font-size="11.5" fill="#6c757d">Name</text>
  <text x="560" y="432" font-size="11.5" fill="#6c757d">Price</text>
  <text x="680" y="432" font-size="11.5" fill="#6c757d">Unit</text>

  <line x1="40" y1="444" x2="840" y2="444" stroke="#dee2e6"/>
  <text x="44" y="464" font-size="13" fill="#212529">TN-4471</text>
  <text x="200" y="464" font-size="13" fill="#212529">Toner cartridge, black</text>
  <text x="560" y="464" font-size="13" fill="#212529">$84.50</text>
  <text x="680" y="464" font-size="13" fill="#212529">Each</text>

  <line x1="40" y1="478" x2="840" y2="478" stroke="#dee2e6"/>
  <text x="44" y="498" font-size="13" fill="#212529">PP-1120</text>
  <text x="200" y="498" font-size="13" fill="#212529">Copier paper, A4</text>
  <text x="560" y="498" font-size="13" fill="#212529">$32.99</text>
  <text x="680" y="498" font-size="13" fill="#212529">Carton</text>

  <line x1="40" y1="512" x2="840" y2="512" stroke="#dee2e6"/>
  <text x="44" y="532" font-size="13" fill="#212529">SD-0087</text>
  <text x="200" y="532" font-size="13" fill="#212529">Standing desk converter</text>
  <text x="560" y="532" font-size="13" fill="#212529">$206.25</text>
  <text x="680" y="532" font-size="13" fill="#212529">Each</text>

  <line x1="24" y1="596" x2="856" y2="596" stroke="#dee2e6"/>
  <text x="24" y="618" font-size="11" fill="#adb5bd">A vendor supplying nothing — an empty state, not a headers-only table</text>

  <rect x="24" y="628" width="832" height="60" rx="10" fill="#f8f9fa"/>
  <text x="44" y="654" font-size="15" fill="#212529">Products</text>
  <text x="440" y="676" font-size="12.5" fill="#6c757d" text-anchor="middle">No products from this vendor yet.</text>
</svg>
