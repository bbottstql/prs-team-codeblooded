<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Header variants showing the signed-in user's roles</title>
  <desc>Five states of the application header: reviewer, admin, both roles, no elevated role, and signed out. The role appears as secondary text beneath the user's name; a user with no elevated role gets no label at all.</desc>

  <rect width="880" height="352" fill="#ffffff"/>

  <text x="24" y="18" font-size="11" fill="#adb5bd">Reviewer</text>
  <rect x="24" y="26" width="832" height="44" rx="8" fill="#f8f9fa"/>
  <rect x="44" y="39" width="18" height="18" rx="3" fill="#007AFF"/>
  <text x="72" y="53" font-size="14" fill="#212529">Purchase Request System</text>
  <circle cx="700" cy="48" r="13" fill="#cfe2ff"/>
  <text x="700" y="52" font-size="10" fill="#6c757d" text-anchor="middle">TS</text>
  <text x="720" y="45" font-size="13" fill="#212529">Torrey Schoen</text>
  <text x="720" y="58" font-size="10.5" fill="#6c757d">Reviewer</text>
  <path d="M826 46 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="24" y="102" font-size="11" fill="#adb5bd">Admin</text>
  <rect x="24" y="110" width="832" height="44" rx="8" fill="#f8f9fa"/>
  <rect x="44" y="123" width="18" height="18" rx="3" fill="#007AFF"/>
  <text x="72" y="137" font-size="14" fill="#212529">Purchase Request System</text>
  <circle cx="700" cy="132" r="13" fill="#cfe2ff"/>
  <text x="700" y="136" font-size="10" fill="#6c757d" text-anchor="middle">PR</text>
  <text x="720" y="129" font-size="13" fill="#212529">Priya Raman</text>
  <text x="720" y="142" font-size="10.5" fill="#6c757d">Admin</text>
  <path d="M826 130 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="24" y="186" font-size="11" fill="#adb5bd">Both — the user card would show only “Admin”</text>
  <rect x="24" y="194" width="832" height="44" rx="8" fill="#f8f9fa"/>
  <rect x="44" y="207" width="18" height="18" rx="3" fill="#007AFF"/>
  <text x="72" y="221" font-size="14" fill="#212529">Purchase Request System</text>
  <circle cx="700" cy="216" r="13" fill="#cfe2ff"/>
  <text x="700" y="220" font-size="10" fill="#6c757d" text-anchor="middle">MF</text>
  <text x="720" y="213" font-size="13" fill="#212529">Marcus Feil</text>
  <text x="720" y="226" font-size="10.5" fill="#6c757d">Reviewer · Admin</text>
  <path d="M826 214 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>

  <text x="24" y="270" font-size="11" fill="#adb5bd">No elevated role — no label, not “no role assigned”</text>
  <rect x="24" y="278" width="832" height="44" rx="8" fill="#f8f9fa"/>
  <rect x="44" y="291" width="18" height="18" rx="3" fill="#007AFF"/>
  <text x="72" y="305" font-size="14" fill="#212529">Purchase Request System</text>
  <circle cx="700" cy="300" r="13" fill="#cfe2ff"/>
  <text x="700" y="304" font-size="10" fill="#6c757d" text-anchor="middle">DW</text>
  <text x="720" y="305" font-size="13" fill="#212529">Dana Ward</text>
  <path d="M826 298 l5 5 l5 -5" stroke="#6c757d" stroke-width="1.5" fill="none"/>
</svg>
