<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>S2-B — duplicate a request</title>
  <desc>The Duplicate button added to the request detail page header row, and the resulting new request: description prefixed Copy of, status NEW, owned by the signed-in user, with the same line items and a correctly calculated total.</desc>

  <rect width="880" height="292" fill="#ffffff"/>

  <text x="24" y="20" font-size="11" fill="#adb5bd">The Duplicate button in the page header row — the only change to this row</text>

  <text x="24" y="52" font-size="20" fill="#212529">Request</text>
  <rect x="540" y="32" width="106" height="30" rx="5" fill="#ffffff" stroke="#0d6efd"/>
  <text x="593" y="52" font-size="12.5" fill="#0d6efd" text-anchor="middle">Duplicate</text>
  <rect x="656" y="32" width="130" height="30" rx="5" fill="#0d6efd"/>
  <text x="721" y="52" font-size="12.5" fill="#ffffff" text-anchor="middle">Send for Review</text>
  <text x="836" y="52" font-size="15" fill="#007AFF" text-anchor="end">✎</text>
  <line x1="24" y1="72" x2="856" y2="72" stroke="#dee2e6" stroke-width="2"/>

  <text x="24" y="106" font-size="11" fill="#adb5bd">After duplicating — you land on the new request, not the original</text>

  <text x="24" y="134" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#adb5bd">/requests/detail/51</text>

  <text x="24" y="164" font-size="11" fill="#6c757d">Description</text>
  <text x="24" y="180" font-size="13" fill="#212529"><tspan fill="#0a58ca">Copy of </tspan>Laptop docking stations</text>
  <text x="24" y="206" font-size="11" fill="#6c757d">Justification</text>
  <text x="24" y="222" font-size="13" fill="#212529">New hires start next month</text>

  <text x="380" y="164" font-size="11" fill="#6c757d">Delivery Method</text>
  <text x="380" y="180" font-size="13" fill="#212529">Delivery</text>
  <text x="380" y="206" font-size="11" fill="#6c757d">Status</text>
  <rect x="380" y="212" width="46" height="19" rx="4" fill="#0d6efd"/>
  <text x="403" y="225.5" font-size="10.5" fill="#ffffff" text-anchor="middle">NEW</text>

  <text x="616" y="164" font-size="11" fill="#6c757d">Requested By</text>
  <text x="616" y="180" font-size="13" fill="#212529">Torrey Schoen <tspan fill="#adb5bd">(you)</tspan></text>
  <text x="616" y="206" font-size="11" fill="#6c757d">Total</text>
  <text x="616" y="222" font-size="13" fill="#212529">$1,240.00</text>

  <rect x="24" y="248" width="832" height="34" rx="8" fill="#f8f9fa"/>
  <text x="440" y="270" font-size="11.5" fill="#6c757d" text-anchor="middle">Items — every line copied, quantities intact, total recalculated. Not $0.00</text>
</svg>
